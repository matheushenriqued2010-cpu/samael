*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--pink2);font-family:'VT323','Courier New',monospace;overflow-x:hidden}
body{min-height:100dvh;display:flex;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;width:3px;height:3px;background:#ffd1e8;border-radius:50%;animation:tw 3s infinite ease-in-out}
@keyframes tw{50%{opacity:.15;transform:scale(.5)}}
.fh{position:absolute;bottom:-30px;color:var(--pink);opacity:.5;animation:up linear forwards;text-shadow:var(--glow)}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
main{position:relative;z-index:1;width:100%;max-width:480px;padding:0 4vw 20px;display:flex;flex-direction:column;align-items:center}
h1{margin:18px 0 0;text-align:center;font-family:'Old English Five','Old English Text MT','UnifrakturCook',serif;line-height:.95;text-shadow:var(--glow)}
h1 small{display:flex;align-items:center;gap:8px;font-size:clamp(24px,8vw,40px);color:#fff;font-weight:500}
h1 small span{white-space:nowrap}
h1 small i{font-style:normal;color:var(--pink);font-size:.6em}
.ln{flex:1;height:2px;background:var(--pink);box-shadow:var(--glow)}
.hd{position:relative;width:100%}
.hd .dh{font-size:34px}
h1 b{display:block;font-size:clamp(54px,19vw,92px);color:var(--pink);letter-spacing:1px}
.sub{font-size:clamp(19px,5.4vw,26px);margin:6px 0 10px;text-align:center}
.scene{position:relative;width:calc(100% + 8vw);margin:0 -4vw}
.scene img{display:block;width:100%;height:auto}
.scene .bg{aspect-ratio:1000/789;background:var(--bgimg) center/100% 100%;image-rendering:pixelated;-webkit-mask-image:linear-gradient(to right,transparent,#000 14%,#000 86%,transparent),linear-gradient(to bottom,transparent,#000 16%,#000 95%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 14%,#000 86%,transparent),linear-gradient(to bottom,transparent,#000 16%,#000 95%,transparent);mask-composite:intersect}
body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 45%,rgba(255,79,163,.07),transparent 65%)}
.scene .chars{position:absolute;left:0;top:0;pointer-events:none;filter:drop-shadow(0 0 10px rgba(255,79,163,.25))}
.dh{position:absolute;color:var(--pink);text-shadow:var(--glow);pointer-events:none;animation:fl 3s infinite ease-in-out}
@keyframes fl{50%{transform:translateY(-6px) scale(1.12);opacity:.6}}
#moon{position:absolute;left:41%;top:4.5%;width:18.5%;aspect-ratio:1;border-radius:50%;background:none;border:0;cursor:pointer;padding:0}
.card{position:relative;width:100%;margin-top:14px;border:2px solid var(--pink);border-radius:10px;padding:18px 38px;text-align:center;font-size:clamp(18px,5vw,25px);line-height:1.2;box-shadow:var(--glow),inset 0 0 0 5px var(--bg),inset 0 0 0 6px rgba(255,79,163,.5)}
.ch{position:absolute;font-style:normal;color:var(--pink);background:var(--bg);padding:0 3px;line-height:1;font-size:26px;text-shadow:var(--glow)}
.tl{left:-8px;top:-13px}.tr{right:-8px;top:-13px}.bl{left:-8px;bottom:-13px}.br{right:-8px;bottom:-13px}
.cs{left:8px;top:50%;transform:translateY(-50%);font-size:28px;background:none}.cs.r{left:auto;right:10px}
.btns{display:flex;gap:12px;width:100%;margin-top:16px;min-height:56px}
.btn{flex:1;font:inherit;font-size:clamp(22px,6vw,28px);padding:12px 6px;border-radius:12px;border:2px solid var(--pink);cursor:pointer;color:var(--pink2);background:#12000c;transition:transform .12s}
.btn:active{transform:scale(.95)}
#yes{background:var(--pink);color:#12000c;font-weight:bold;box-shadow:var(--glow);animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
#no.run{position:fixed;z-index:20;width:120px;flex:none;transition:left .25s,top .25s}
.foot{margin-top:16px;width:100%;font-size:clamp(17px,4.8vw,22px);text-align:center}
.fl{display:flex;align-items:center;gap:10px}
.fi{display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding:0 4px}
.fi svg{width:56px;height:56px;filter:drop-shadow(0 0 6px rgba(255,79,163,.6))}
.fi .bow{font-size:44px}.fi .hh{font-size:44px;color:var(--pink);text-shadow:var(--glow)}
.yw{position:relative;flex:1;display:flex}.yw .btn{width:100%}
.cur{position:absolute;right:-12px;bottom:-22px;width:38px;height:38px;pointer-events:none;filter:drop-shadow(0 0 6px rgba(255,79,163,.7))}
.toast{position:fixed;left:50%;top:18%;transform:translate(-50%,-20px);background:#12000c;border:2px solid var(--pink);border-radius:12px;padding:10px 16px;opacity:0;z-index:30;text-align:center;font-size:22px;max-width:88vw;transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
#win{position:fixed;inset:0;z-index:40;background:rgba(5,0,7,.96);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}
#win.on{display:flex}
#win h2{font-family:'Old English Five','Old English Text MT','UnifrakturCook',serif;font-size:clamp(38px,12vw,64px);color:var(--pink);margin:0;text-shadow:var(--glow)}
#win p{font-size:clamp(22px,6vw,30px);margin:0}
.heart{position:fixed;z-index:50;pointer-events:none;color:var(--pink);text-shadow:var(--glow)}
.px{display:inline-block;width:1em;height:1em;vertical-align:-.14em;background:var(--hrt) center/contain no-repeat;image-rendering:pixelated;font-style:normal;filter:drop-shadow(0 0 5px rgba(255,79,163,.7))}
.ch.px{background-color:transparent}

.pf{background-image:var(--hf)}.po{background-image:var(--ho)}.sk{background-image:var(--sk)}
body{background:radial-gradient(ellipse at 50% 0%,#1d0016 0,#050007 58%)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hd,.scene,.btns,.foot{animation:rise .9s both}
.scene{animation-delay:.25s}.btns{animation-delay:.7s}.foot{animation-delay:.9s}
h1 b{background:linear-gradient(180deg,#ffc2e2,#ff4fa3 55%,#c2185b);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px rgba(255,210,235,.3);text-shadow:none;filter:drop-shadow(0 0 14px rgba(255,79,163,.55));animation:shim 3.5s ease-in-out infinite}
@keyframes shim{50%{filter:drop-shadow(0 0 26px rgba(255,79,163,.95))}}
h1 small{text-shadow:0 0 10px rgba(255,79,163,.8)}
.sub,.card{text-shadow:0 0 8px rgba(255,79,163,.45)}
.ln{background:linear-gradient(90deg,transparent,var(--pink))}.ln~span~.ln{background:linear-gradient(270deg,transparent,var(--pink))}
.card{background:linear-gradient(180deg,rgba(45,0,30,.6),rgba(8,0,8,.88));animation:rise .9s .5s both,cg 3.2s 1.4s ease-in-out infinite}
@keyframes cg{50%{box-shadow:0 0 28px rgba(255,79,163,.95),inset 0 0 0 5px var(--bg),inset 0 0 0 6px rgba(255,79,163,.8)}}
.btn{box-shadow:0 5px 0 #4d0d31;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #4d0d31}
#yes{background:linear-gradient(180deg,#ff8ac4,#ff4fa3);animation:none;position:relative;overflow:hidden;box-shadow:0 5px 0 #9c1f66,0 0 22px rgba(255,79,163,.7)}
#yes:active{box-shadow:0 1px 0 #9c1f66,0 0 22px rgba(255,79,163,.7)}
#yes::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);animation:shine 2.8s infinite}
@keyframes shine{to{left:140%}}
.yw{animation:pulse 1.8s infinite}
#moon{box-shadow:0 0 46px 10px rgba(255,120,190,.3);animation:mg 4s ease-in-out infinite}
@keyframes mg{50%{box-shadow:0 0 70px 22px rgba(255,120,190,.5)}}
.scene .chars{animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.shoot{position:fixed;width:90px;height:2px;background:linear-gradient(90deg,transparent,#ffd1e8);animation:sh 1.2s linear forwards;z-index:0}
@keyframes sh{from{transform:translate(0,0) rotate(28deg);opacity:1}to{transform:translate(280px,150px) rotate(28deg);opacity:0}}
.px.sk{filter:drop-shadow(0 0 4px rgba(255,150,210,.9))}

<div id="win">
  <h2>ELA DISSE SIM! <i class="px"></i></h2>

</div>
<script>
const $=s=>document.querySelector(s);
const sky=$('#sky');
for(let i=0;i<45;i++){const s=document.createElement('div');s.className='star';
  s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s`;sky.appendChild(s)}
setInterval(()=>{const h=document.createElement('div');h.className='fh px '+['','pf','po'][Math.floor(Math.random()*3)];
  h.style.left=Math.random()*100+'%';h.style.fontSize=(10+Math.random()*16)+'px';
  h.style.animationDuration=(7+Math.random()*6)+'s';sky.appendChild(h);setTimeout(()=>h.remove(),13000)},900);

setInterval(()=>{const s=document.createElement('div');s.className='shoot';s.style.left=Math.random()*60+'%';s.style.top=Math.random()*25+'%';sky.appendChild(s);setTimeout(()=>s.remove(),1300)},5000);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}

let moon=0;
$('#moon').onclick=()=>{moon++;if(moon>=3){moon=0;toast('Segredo achado: eu te amo mais que a lua!')}};

const no=$('#no');let tries=0;
const msgs=['Tem certeza?','Tenta de novo...','O botão tá com medo!','Aceitar é mais fácil','Não tem como fugir'];
function run(e){
  e.preventDefault();tries++;
  if(!no.classList.contains('run')){const r=no.getBoundingClientRect();no.classList.add('run');no.style.left=r.left+'px';no.style.top=r.top+'px'}
  const w=innerWidth-130,h=innerHeight-70;
  no.style.left=Math.max(8,Math.random()*w)+'px';
  no.style.top=Math.max(8,Math.random()*h)+'px';
  toast(msgs[tries%msgs.length]);
}
no.addEventListener('touchstart',run,{passive:false});
no.addEventListener('mouseover',run);
no.addEventListener('click',run);

function burst(){
  for(let i=0;i<60;i++){
    const h=document.createElement('div');h.className='heart px '+['','pf','po','sk'][i%4];
    const x=innerWidth/2,y=innerHeight/2,a=Math.random()*6.28,d=100+Math.random()*Math.min(innerWidth,innerHeight)*.6;
    h.style.cssText+=`left:${x}px;top:${y}px;font-size:${16+Math.random()*22}px;transition:transform 1.4s cubic-bezier(.1,.8,.3,1),opacity 1.4s`;
    document.body.appendChild(h);
    requestAnimationFrame(()=>{h.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) rotate(${Math.random()*360}deg)`;h.style.opacity=0});
    setTimeout(()=>h.remove(),1500);
  }
}
$('#yes').onclick=()=>{burst();setTimeout(()=>{$('#win').classList.add('on');burst()},700)};
</script>
